name: GhettoZones
options:
  bundleIdPrefix: com.mousuppe
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 8.0.0

targets:
  GhettoZones:
    type: application
    platform: macOS
    sources:
      - path: Zones
        excludes:
          - Info.plist
    resources:
      - path: Zones/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mousuppe.GhettoZones
        PRODUCT_NAME: GhettoZones
        INFOPLIST_FILE: Zones/Info.plist
        CODE_SIGN_ENTITLEMENTS: Zones/GhettoZones.entitlements
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: KeyboardShortcuts
      - package: Defaults

schemes:
  GhettoZones:
    build:
      targets:
        GhettoZones: all
    run:
      config: Debug
